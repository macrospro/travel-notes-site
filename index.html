   - 指针视差：整张地图跟着鼠标轻微反向位移，制造「离纸面」的深度
   不引第三方动画库：单文件交付物要能 file:// 直接打开，任何 CDN 都不可用，
   这里用 CSS cubic-bezier(.16,1,.3,1) 弹簧曲线 + transform/opacity 实现同样的手感。 */
(function () {
  var root = document.querySelector('[data-atlas]');
  if (!root) return;

  var svg = root.querySelector('.atlas-svg');
  var map = root.querySelector('.atlas-map');
  var tip = root.querySelector('.atlas-tip');

  var tipCount = tip ? tip.querySelector('i') : null;
  var panel = root.querySelector('#atlas-panel');
  var panelTitle = root.querySelector('#atlas-panel-title');
  var panelCount = root.querySelector('#atlas-panel-count');

  var empty = root.querySelector('#atlas-empty');
  var closeBtn = root.querySelector('#atlas-close');
  var stage = root.querySelector('.atlas-stage');
  var regions = Array.prototype.slice.call(root.querySelectorAll('.ar'));

    groups[s.getAttribute('data-group')] = s;
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var picked = '';

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  /* ---------- 名签 ---------- */
  function showTip(g) {
    if (!tip) return;
    var name = g.getAttribute('data-province') || '';
    var n = Number(g.getAttribute('data-count') || 0);
    if (tipName) tipName.textContent = name;
    if (tipCount) tipCount.textContent = n ? pad2(n) + ' 篇' : '尚无记录';
    tip.classList.add('is-on');

    // 名签用省份标签点定位，再夹在画布内，避免贴边溢出
    var w = map.clientWidth, h = map.clientHeight;
    var x = Number(g.getAttribute('data-lx')) / 900 * w;
    var y = Number(g.getAttribute('data-ly')) / 640 * h;
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    x = clamp(x, tw / 2 + 6, Math.max(tw / 2 + 6, w - tw / 2 - 6));
    y = clamp(y - th * 1.15, th / 2 + 6, Math.max(th / 2 + 6, h - th / 2 - 6));

    tip.style.top = y + 'px';

  function hideTip() { if (tip) tip.classList.remove('is-on'); }

  function syncActive() {

    if (picked || root.querySelector('.ar.is-hot')) svg.setAttribute('data-active', '');
    else svg.removeAttribute('data-active');
  }

  /* ---------- 面板 ---------- */
  function open(name) {

      syncActive();
    });
    g.addEventListener('focus', function () {
      g.classList.add('is-hot');
      showTip(g);
      syncActive();
    });
    g.addEventListener('blur', function () {
      g.classList.remove('is-hot');
      hideTip();
      syncActive();

  };

  if (closeBtn) closeBtn.addEventListener('click', function () { close(); });

  // 点击地图空白处收起面板；点省份已在上面拦下
  if (stage) {
    stage.addEventListener('click', function (event) {
      if (panel && panel.contains(event.target)) return;
      if (event.target.closest && event.target.closest('.ar')) return;
      if (picked) close();
    });
  }

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && picked) close();
  });

  /* ---------- 指针视差 ---------- */
  if (!reduce) {
    var timer = 0, px = 0, py = 0;
    document.addEventListener('pointermove', function (event) {
      if (event.pointerType === 'touch') return;
      px = (event.clientX / window.innerWidth - 0.5) * -9;
      py = (event.clientY / window.innerHeight - 0.5) * -7;
      if (timer) return;
      timer = window.setTimeout(function () {
        timer = 0;
        map.style.setProperty('--px', px.toFixed(2) + 'px');
        map.style.setProperty('--py', py.toFixed(2) + 'px');
      }, 16);
    }, { passive: true });
  }

  /* ---------- 右下角主题切换 ---------- */
  var themeBtn = root.querySelector('#atlas-theme');
  if (themeBtn) {
    var docEl = document.documentElement;
    var isDark = function () {
      return docEl.dataset.theme === 'dark' ||
        (!docEl.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    };
    var syncTheme = function () {
      var dark = isDark();
      themeBtn.setAttribute('aria-label', dark ? '切换到白天配色' : '切换到夜晚配色');
      themeBtn.setAttribute('title', dark ? '切换到白天配色' : '切换到夜晚配色');
      themeBtn.textContent = dark ? '☀' : '◐';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0E1C22' : '#FAFDFB');
    };
    themeBtn.addEventListener('click', function () {
      docEl.dataset.theme = isDark() ? 'light' : 'dark';
      try { localStorage.setItem('wb-theme', docEl.dataset.theme); } catch (e) {}
      syncTheme();
    });
    syncTheme();
  }
})();
