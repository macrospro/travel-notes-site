<p>节假日断桥人最多，不如从北山街往西走，梧桐叶子落下来的时候，湖面会安静很多。</p>
<h2 id="茅家埠的下午">茅家埠的下午</h2>
<p>这一带水面窄、树影密，比湖滨更像旧时候的西湖。带一杯热茶坐到太阳偏西，是本趟最舒服的两小时。</p>

<ul>
<li>全程步行约 6 公里，穿好走的鞋。</li>

        '<span class="wb-lb-zoom">100%</span>' +
        '<span class="wb-lb-spacer"></span>' +
        '<button class="wb-lb-btn" type="button" data-lb-nav="zoom" aria-pressed="false">⤢ 1:1</button>' +
        '<button class="wb-lb-btn wb-lb-btn--step" type="button" data-lb-nav="out" aria-label="缩小">−</button>' +
        '<button class="wb-lb-btn wb-lb-btn--step" type="button" data-lb-nav="in" aria-label="放大">＋</button>' +
        '<button class="wb-lb-btn wb-lb-btn--nav" type="button" data-lb-nav="prev" aria-label="上一张">‹</button>' +
        '<button class="wb-lb-btn wb-lb-btn--nav" type="button" data-lb-nav="next" aria-label="下一张">›</button>' +
        '<button class="wb-lb-btn wb-lb-btn--close" type="button" data-lb-nav="close" aria-label="关闭预览">✕</button>' +

      '</div></div>' +

    view = overlay.querySelector('.wb-lb-img');
    viewport = overlay.querySelector('.wb-lb-viewport');
    countEl = overlay.querySelector('.wb-lb-count');
    dimEl = overlay.querySelector('.wb-lb-dim');
    zoomEl = overlay.querySelector('.wb-lb-zoom');

    nextBtn = overlay.querySelector('[data-lb-nav="next"]');

    paint();
    overlay.hidden = false;
    overlay.setAttribute('aria-hidden', 'false');
    /* 锁背景滚动，并补偿滚动条消失带来的宽度变化 */
    var sbw = window.innerWidth - document.documentElement.clientWidth;
    if (sbw > 0) document.body.style.paddingRight = (parseInt(savedPad, 10) || 0) + sbw + 'px';
    document.documentElement.classList.add('wb-lb-open');
    open = true;
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { if (open) overlay.classList.add('is-open'); });
    } else { overlay.classList.add('is-open'); }
    try { document.dispatchEvent(new CustomEvent('wb:lightbox-open')); } catch (err) {}
    try { closeBtn.focus({ preventScroll: true }); } catch (err) { try { closeBtn.focus(); } catch (e2) {} }
  }

  function close() {
    if (!open || closing || !overlay) return;
    closing = true;
    open = false;
    /* 立刻作废所有待返回的异步预加载，并归零档位状态 */
    gen++; tierGen++; tier = 'thumb'; wantTier = 'view';
    overlay.removeAttribute('data-loading-tier');
    /* 关闭瞬间归零内部状态（不重绘 transform，避免淡出时照片突然缩一下）；
       快速重新打开不会残留上一次的倍率，DOM 在淡出回调里再彻底复位。 */
    scale = 1; tx = 0; ty = 0;
    overlay.classList.remove('is-open', 'is-dragging', 'is-instant');
    document.documentElement.classList.remove('wb-lb-open');
    document.body.style.paddingRight = savedPad;
    if ((window.scrollY || window.pageYOffset || 0) !== savedY) window.scrollTo(0, savedY);
    clearTimeout(closeTimer); clearTimeout(pressTimer);
    closeTimer = setTimeout(function () {
      overlay.hidden = true;
      overlay.setAttribute('aria-hidden', 'true');
      overlay.classList.remove('is-magnified');
      view.removeAttribute('data-loading');
      view.removeAttribute('src');
      view.style.width = ''; view.style.height = '';
      resetView();
      if (pointers) pointers.clear(); else active = [];
      gesture = pinch = null;
      closing = false;
      if (lastFocus && lastFocus.focus) {
        try { lastFocus.focus({ preventScroll: true }); } catch (err) { try { lastFocus.focus(); } catch (e2) {} }
      }
    }, 200);
  }

  function step(d) {
    if (list.length < 2) return;
    index = (index + d + list.length) % list.length;
    resetView();
    paint();
  }

  /* 找出这次点击想放大哪张图。封面被渐变遮罩 / 标题覆盖，
     所以整块 .post-hero 都作为触发区（链接和按钮仍然优先保持原行为）。 */
  function findTarget(e) {
    var t = e.target;
    if (!t || !t.closest || t.closest('#' + ID)) return null;
    var img = t.tagName === 'IMG' ? t : t.closest('img');
    if (img && zoomable(img)) return img;
    if (t.closest('a, button, input, textarea, select, [contenteditable="true"]')) return null;
    var cover = t.closest('.post-hero');
    if (cover) {
      /* 点的是遮罩 / 标题时，要认「当前正显示的那张」封面。
         多目的地文章里第一张 .post-hero-img 是默认地点（大理），
         直接用 querySelector 会把成都入口误开成大理的图。 */
      var shots = cover.querySelectorAll('.post-hero-img');
      for (var i = 0; i < shots.length; i++) {
        if (!shots[i].hidden && zoomable(shots[i])) return shots[i];
      }
    }
    return null;
  }

  document.addEventListener('click', function (e) {
    if (open || closing) return;
    var img = findTarget(e);
    if (!img) return;
    e.preventDefault();
    e.stopPropagation();
    openAt(img);
  }, true);

  document.addEventListener('keydown', function (e) {
    if (!open) return;
    e.stopPropagation();
    if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomBy(1.4); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomBy(1 / 1.4); }
    else if (e.key === '0') { e.preventDefault(); resetView(); }
  }, true);

  /* 滚轮：以光标为锚点连续缩放；捕获阶段拦住，背景不会跟着切屏 / 滚动。 */
  try {
    document.addEventListener('wheel', function (e) {
      if (!open) return;
      e.stopPropagation();
      if (!e.target || !e.target.closest || !e.target.closest('#' + ID)) return;
      e.preventDefault();
      var dy = e.deltaY || 0;
      if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
      zoomAt(scale * clamp(Math.pow(1.0018, -dy), 0.6, 1.6), e.clientX, e.clientY);
    }, { capture: true, passive: false });
    document.addEventListener('touchmove', function (e) {
      if (!open) return;
      e.stopPropagation();
      if (e.target && e.target.closest && e.target.closest('#' + ID)) e.preventDefault();
    }, { capture: true, passive: false });
  } catch (err) {
    document.addEventListener('wheel', function (e) {
      if (!open) return;
      e.stopPropagation(); e.preventDefault();
      zoomAt(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
    }, true);
  }

  window.addEventListener('resize', function () {
    if (!open) return;
    pinFit(); clampPan(); apply(true); updateHud();
  });

  /* 给图片打标记，只用来显示 zoom-in 光标；动态插入的图由 MutationObserver 兜底。 */
  function mark() {
    Array.prototype.slice.call(document.querySelectorAll('img')).forEach(function (img) {
      if (zoomable(img)) img.setAttribute('data-wb-zoom', '');
    });
    Array.prototype.slice.call(document.querySelectorAll('.post-hero')).forEach(function (c) {
      if (c.querySelector('.post-hero-img')) c.classList.add('wb-zoom-zone');
    });
  }
  function observe() {
    if (!window.MutationObserver) return;
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        Array.prototype.slice.call(m.addedNodes).forEach(function (n) {
          if (!n || n.nodeType !== 1 || n.closest('#' + ID)) return;
          if (n.tagName === 'IMG' && zoomable(n)) n.setAttribute('data-wb-zoom', '');
          else if (n.querySelectorAll) {
            Array.prototype.slice.call(n.querySelectorAll('img')).forEach(function (im) {
              if (zoomable(im)) im.setAttribute('data-wb-zoom', '');
            });
          }
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }
  function init() { mark(); observe(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  /* 供编辑器缩略图主动打开，也方便写回归测试。 */
  window.WBLightbox = {
    open: function (img) {
      if (img && srcOf(img) && !img.closest('#' + ID)) openAt(img);
    },
    close: close,
    isOpen: function () { return open; },
    zoom: function (s, cx, cy) { if (open) zoomAt(s, cx, cy); },
    reset: function () { if (open) resetView(); },
    state: function () {
      return { scale: scale, x: tx, y: ty, count: list.length, index: index,
               tier: tier, want: wantTier,
               src: view ? view.getAttribute('src') : '',
               natural: view ? [view.naturalWidth, view.naturalHeight] : [0, 0] };
    },
  };
})();
</script></body></html>
